name: Nova Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install --disable-pip-version-check pillow pyinstaller pefile
      - name: Validate and test Windows preview
        run: |
          python -m py_compile desktop/nova_desktop.py
          python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Generate and verify Veyrion EXE icon
        run: |
          python tools/build_icons.py
          python tools/build_icons.py --verify
      - name: Package Windows preview
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/NovaGame.ico --name NovaGame-Windows desktop/nova_desktop.py
      - name: Verify Windows executable icon resource
        run: python -c "import pefile; p=pefile.PE(r'dist/NovaGame-Windows.exe'); assert any(e.id==14 for e in p.DIRECTORY_ENTRY_RESOURCE.entries)"
      - uses: actions/upload-artifact@v4
        with:
          name: NovaGame-Windows-preview
          path: dist/NovaGame-Windows.exe
          if-no-files-found: error
          retention-days: 14
