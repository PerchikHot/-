name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate and verify Veyrion launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 tools/build_icons.py
          python3 tools/build_icons.py --verify
      - name: Run Android memory scoring unit tests
        run: gradle testDebugUnitTest --no-daemon
      - run: gradle assembleDebug --no-daemon
      - name: Verify APK contains new launcher icons
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'res/mipmap-[^/]+/ic_launcher[^/]*\.png'
      - uses: actions/upload-artifact@v4
        with:
          name: NovaGame-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish Android APK for All Hub
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nova-android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create nova-android --repo "$GITHUB_REPOSITORY" --title "Nova Android" --notes "Development APK" --latest=false
          cp app/build/outputs/apk/debug/app-debug.apk NovaGame-Android.apk
          gh release upload nova-android NovaGame-Android.apk --repo "$GITHUB_REPOSITORY" --clobber
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          gh release edit nova-android --repo "$GITHUB_REPOSITORY" --notes "Version: $VERSION" --latest=false
